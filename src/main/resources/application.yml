spring:
  application:
    name: vault-management

  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/vaultdb.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Bangkok

  thymeleaf:
    cache: false

  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:8080}
  # Tomcat access log — บันทึกทุก HTTP request (method, path, status, latency, IP)
  # ไม่ log body/header จึงไม่รั่ว PIN / x-auth-code / x-iot-secret
  # ไฟล์อยู่ที่ <basedir>/logs/access_log.<date>.log — rotate รายวันอัตโนมัติ
  # basedir = working dir (.) กัน embedded Tomcat ไปเขียนลง temp dir; EC2 override ได้ด้วย TOMCAT_BASEDIR
  tomcat:
    basedir: ${TOMCAT_BASEDIR:.}
    accesslog:
      enabled: ${ACCESS_LOG_ENABLED:true}
      directory: logs
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd
      rotate: true
      # %D = duration (microseconds ใน Tomcat 10)
      pattern: '%t %a "%r" %s %b %Dus'

# AWS Configuration (ใช้ IAM Role — ไม่ต้องใส่ key โดยตรง)
aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket: ${AWS_S3_BUCKET:vault-storage}
  iot:
    endpoint: ${AWS_IOT_ENDPOINT:}

# Admin credentials (สำหรับ Management UI login)
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}

api:
  auth-code: ${API_AUTH_CODE:}

# IoT Lambda callback secret — ต้องตรงกับ IOT_CALLBACK_SECRET ใน Lambda env
iot:
  callback:
    secret: ${IOT_CALLBACK_SECRET:dev-iot-secret}

# Session booking — itemId พิเศษ: จองช่วงเวลา หยิบ/เปลี่ยนเกมไหนก็ได้จนหมดเวลา
# booking ที่ใช้ item เหล่านี้จะไม่จบเมื่อคืนของ (track เป็น MOVE: ใน timeline)
# จบเมื่อหมดเวลา (scheduler ทุก 1 นาที) หรือ cancel — คั่นหลาย id ด้วย comma
session:
  item-ids: ${SESSION_ITEM_IDS:SESSION-PASS}

# Request/Response payload logging — dev debug เท่านั้น
# log body เต็ม (รวม PIN) แต่ mask header credential — ควรตั้ง false ใน prod
app:
  request-logging:
    enabled: ${REQUEST_LOGGING_ENABLED:true}

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
