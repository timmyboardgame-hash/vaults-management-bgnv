<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Vaultkeep'">Vaultkeep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body>

<header th:fragment="topbar" class="topbar">
    <div class="topbar-left">
        <!-- hamburger — แสดงเฉพาะจอเล็ก เปิด/ปิด sidebar แบบ off-canvas -->
        <button class="topbar-menu-btn" type="button" aria-label="Toggle menu"
                onclick="document.body.classList.toggle('sidebar-open')">
            <i class="bi bi-list"></i>
        </button>
        <a class="topbar-brand" th:href="@{/}">
            <div class="topbar-brand-mark">V</div>
            <div>
                <div class="topbar-brand-name">Vaultkeep</div>
                <div class="topbar-brand-sub">Admin Console</div>
            </div>
        </a>
    </div>
    <div class="topbar-right">
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button class="btn-ghost-sm" type="submit">
                <i class="bi bi-box-arrow-right"></i>
                Sign out
            </button>
        </form>
    </div>
    <!-- backdrop ปิด sidebar เมื่อแตะพื้นที่นอกเมนู (จอเล็ก) -->
    <div class="sidebar-backdrop" onclick="document.body.classList.remove('sidebar-open')"></div>
</header>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar-section">Overview</div>
    <nav class="sidebar-nav">
        <a th:href="@{/}"
           th:class="${active == 'home'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>
    </nav>
    <div class="sidebar-section">Resources</div>
    <nav class="sidebar-nav">
        <a th:href="@{/agents}"
           th:class="${active == 'agents'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-shop"></i>
            <span>Agents</span>
        </a>
        <a th:href="@{/vaults}"
           th:class="${active == 'vaults'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-safe2-fill"></i>
            <span>Vaults</span>
        </a>
        <a th:href="@{/items}"
           th:class="${active == 'items'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-dice-5-fill"></i>
            <span>Items</span>
        </a>
        <a th:href="@{/bookings}"
           th:class="${active == 'bookings'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-calendar-check-fill"></i>
            <span>Bookings</span>
        </a>
        <a th:href="@{/booking-monitor}"
           th:class="${active == 'booking-monitor'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>Booking Monitor</span>
        </a>
        <a th:href="@{/vault-items}"
           th:class="${active == 'vault-items'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-box-seam-fill"></i>
            <span>Vault Items</span>
        </a>
        <a th:href="@{/bindings}"
           th:class="${active == 'bindings'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-link-45deg"></i>
            <span>Bindings</span>
        </a>
    </nav>
</aside>

</body>
</html>
