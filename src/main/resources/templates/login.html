<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Vaultkeep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: var(--vm-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-glow-1 {
            position: absolute; top: 10%; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(109,40,217,.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-glow-2 {
            position: absolute; bottom: 5%; right: 10%;
            width: 300px; height: 300px; border-radius: 50%;
            background: radial-gradient(circle, rgba(56,189,248,.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-card {
            background: var(--vm-surface);
            border: 1px solid var(--vm-border);
            border-radius: 20px;
            padding: 2.5rem 2.75rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 24px 64px rgba(0,0,0,.4), 0 0 0 1px rgba(124,58,237,.08);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 1.75rem;
        }
        .login-brand-mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: var(--vm-violet-grad);
            display: grid; place-items: center;
            box-shadow: var(--vm-glow);
            color: #fff; font-size: 1.125rem; font-weight: 700;
            flex-shrink: 0;
        }
        .login-brand-name {
            font-weight: 700;
            font-size: 1.0625rem;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .login-brand-sub {
            font-size: 0.6875rem;
            color: var(--vm-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .login-heading { margin-bottom: 1.75rem; }
        .login-heading h1 {
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 0.375rem;
        }
        .login-heading p {
            font-size: 0.8125rem;
            color: var(--vm-muted);
            margin: 0;
        }

        .login-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--vm-text-2);
            margin-bottom: 0.4375rem;
        }

        .login-input {
            width: 100%;
            background: var(--vm-input);
            border: 1px solid var(--vm-border-2);
            border-radius: var(--vm-radius-sm);
            color: var(--vm-text);
            padding: 0.625rem 0.875rem;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-input::placeholder { color: var(--vm-muted); }
        .login-input:focus {
            border-color: var(--vm-violet);
            box-shadow: 0 0 0 3px var(--vm-violet-soft);
        }

        .login-submit {
            width: 100%;
            padding: 0.6875rem 0.875rem;
            border-radius: var(--vm-radius-sm);
            background: var(--vm-violet-grad);
            border: none;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(124,58,237,.35);
            transition: opacity 0.15s, box-shadow 0.15s;
            margin-top: 0.25rem;
        }
        .login-submit:hover {
            opacity: 0.92;
            box-shadow: 0 6px 20px rgba(124,58,237,.45);
        }

        .login-divider {
            display: flex; align-items: center; gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .login-divider-line { flex: 1; height: 1px; background: var(--vm-border); }
        .login-divider-label {
            font-size: 0.71rem; color: var(--vm-muted);
            letter-spacing: 0.06em; text-transform: uppercase;
        }

        .login-status {
            background: rgba(124,58,237,.06);
            border: 1px solid var(--vm-border);
            border-radius: 12px;
            padding: 0.75rem 0.875rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
        }
        .login-status-left { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .login-status-right { color: var(--vm-muted); font-size: 0.72rem; }

        .status-dot-green {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--vm-success);
            box-shadow: 0 0 6px rgba(34,197,94,.6);
            flex-shrink: 0;
        }

        .login-footer {
            position: absolute; bottom: 1.25rem; left: 0; right: 0;
            text-align: center;
            font-size: 0.72rem;
            color: var(--vm-muted);
        }
    </style>
</head>
<body>
    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>

    <div class="login-card">

        <div class="login-brand">
            <div class="login-brand-mark">V</div>
            <div>
                <div class="login-brand-name">Vaultkeep</div>
                <div class="login-brand-sub">Admin Console</div>
            </div>
        </div>

        <div class="login-heading">
            <h1>Sign in to your account</h1>
            <p>Manage your locker network from one place</p>
        </div>

        <div th:if="${param.error}" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:.6rem .875rem;font-size:.8125rem;color:#fca5a5;margin-bottom:1rem;">
            <i class="bi bi-exclamation-circle me-1"></i>Invalid username or password.
        </div>
        <div th:if="${param.logout}" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:.6rem .875rem;font-size:.8125rem;color:#86efac;margin-bottom:1rem;">
            <i class="bi bi-check-circle me-1"></i>You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div style="display:flex;flex-direction:column;gap:1rem;">

                <div>
                    <label class="login-label" for="username">Username</label>
                    <input id="username" type="text" class="login-input"
                           name="username" placeholder="admin"
                           autofocus autocomplete="username">
                </div>

                <div>
                    <label class="login-label" for="password">Password</label>
                    <input id="password" type="password" class="login-input"
                           name="password" placeholder="••••••••"
                           autocomplete="current-password">
                </div>

                <button type="submit" class="login-submit">Sign in</button>

            </div>
        </form>

        <div class="login-divider">
            <div class="login-divider-line"></div>
            <span class="login-divider-label">System Status</span>
            <div class="login-divider-line"></div>
        </div>

        <div class="login-status">
            <div class="login-status-left">
                <div class="status-dot-green"></div>
                All systems operational
            </div>
            <div class="login-status-right">38 / 42 online</div>
        </div>

    </div>

    <div class="login-footer">Vaultkeep Admin v2.4 &middot; &copy; 2026 Vault Systems Ltd.</div>

</body>
</html>
