<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- หัว + เนื้อหาประวัติกล่อง สำหรับแสดงใน modal บนหน้า board -->
<div th:fragment="sheet">
    <div class="modal-header">
        <div>
            <h5 class="modal-title">
                <span th:text="${h.itemName}">Item</span>
                <span class="badge rounded-pill ms-1"
                      th:text="${h.out} ? 'ถูกหยิบอยู่' : 'อยู่ในตู้'"
                      th:classappend="${h.out} ? 'badge-ACTIVE' : 'badge-CONFIRMED'">—</span>
            </h5>
            <div class="vb-sheet-meta">
                ประวัติการยืม 30 วันล่าสุด ·
                serial <code th:text="${h.serialNumber != null ? h.serialNumber : '— ยังไม่ตั้ง'}">—</code>
                <span th:if="${h.rfidTag != null}"> · RFID <code th:text="${h.rfidTag}">—</code></span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:.4rem">
            <a class="btn btn-sm btn-ghost"
               th:href="'/booking-monitor/' + ${h.vaultId} + '/' + ${h.itemId}"
               style="font-size:.7rem; text-transform:none; letter-spacing:0"
               title="เปิดเป็นหน้าเต็ม">เปิดหน้าเต็ม <i class="bi bi-box-arrow-up-right"></i></a>
            <button class="btn-close" @click="sheet = null"></button>
        </div>
    </div>
    <div class="modal-body">
        <div th:replace="~{booking-monitor/item-history-parts :: body}"></div>
    </div>
</div>

<div th:fragment="empty">
    <div class="modal-header">
        <h5 class="modal-title">ไม่พบข้อมูลกล่องนี้</h5>
        <button class="btn-close" @click="sheet = null"></button>
    </div>
    <div class="modal-body">
        <p class="vb-empty mb-0">กล่องนี้อาจถูกถอดออกจากตู้แล้ว</p>
    </div>
</div>

</body>
</html>
