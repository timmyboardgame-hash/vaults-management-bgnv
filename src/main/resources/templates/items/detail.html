<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Item Detail')}"></head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar('items')}"></div>

    <main class="main-content" x-data="{ showEdit: false }">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <a href="/items" class="btn btn-sm btn-outline-secondary mb-2">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <h1 class="page-title" th:text="${item.itemNameEn != null ? item.itemNameEn : item.itemId}">Item</h1>
                <p class="page-subtitle">
                    <span class="badge rounded-pill"
                          th:text="${item.itemStatus}"
                          th:classappend="'badge-' + ${item.itemStatus}">—</span>
                </p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div th:if="${item.itemImageUrl != null && !item.itemImageUrl.isEmpty()}">
                    <img th:src="${item.itemImageUrl}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:0.75rem;border:1px solid var(--vm-border-2);">
                </div>
                <button class="btn btn-primary btn-sm" @click="showEdit = true">
                    <i class="bi bi-pencil me-1"></i>Edit
                </button>
            </div>
        </div>

        <div class="row g-3">
            <!-- Basic Info -->
            <div class="col-12 col-md-6">
                <div class="detail-card">
                    <div class="detail-card-title">Basic Info</div>
                    <div class="detail-row">
                        <span class="detail-label">Item ID</span>
                        <span class="detail-value" th:text="${item.itemId}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Name EN</span>
                        <span class="detail-value" th:text="${item.itemNameEn != null ? item.itemNameEn : '—'}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Name TH</span>
                        <span class="detail-value" th:text="${item.itemNameTh != null ? item.itemNameTh : '—'}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">
                            <span class="badge rounded-pill"
                                  th:text="${item.itemStatus}"
                                  th:classappend="'badge-' + ${item.itemStatus}">—</span>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Game Code</span>
                        <span class="detail-value" th:text="${item.gameCode != null ? item.gameCode : '—'}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Default PIN</span>
                        <span class="detail-value">
                            <code th:if="${item.defaultPin != null}" th:text="${item.defaultPin}">—</code>
                            <span th:unless="${item.defaultPin != null}" class="text-muted">— (random)</span>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Created</span>
                        <span class="detail-value"
                              th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</span>
                    </div>
                </div>
            </div>

            <!-- Game Info -->
            <div class="col-12 col-md-6">
                <div class="detail-card">
                    <div class="detail-card-title">Game Info</div>
                    <div class="detail-row">
                        <span class="detail-label">Players</span>
                        <span class="detail-value"
                              th:text="${item.playerCountMin != null && item.playerCountMax != null
                                        ? item.playerCountMin + ' – ' + item.playerCountMax
                                        : (item.playerCountMin != null ? item.playerCountMin : '—')}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Play Time</span>
                        <span class="detail-value"
                              th:text="${item.playTimeMin != null && item.playTimeMax != null
                                        ? item.playTimeMin + ' – ' + item.playTimeMax + ' min'
                                        : (item.playTimeMin != null ? item.playTimeMin + ' min' : '—')}">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Difficulty</span>
                        <span class="detail-value" th:text="${item.difficultyRating != null ? item.difficultyRating : '—'}">—</span>
                    </div>
                </div>
            </div>

            <!-- Links -->
            <div class="col-12">
                <div class="detail-card">
                    <div class="detail-card-title">Links</div>
                    <div class="detail-row">
                        <span class="detail-label">BoardGameGeek</span>
                        <span class="detail-value">
                            <a th:if="${item.linkBoardgamegeek != null}" th:href="${item.linkBoardgamegeek}" target="_blank" rel="noopener">BGG</a>
                            <span th:unless="${item.linkBoardgamegeek != null}">—</span>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Video</span>
                        <span class="detail-value">
                            <a th:if="${item.linkVideo != null}" th:href="${item.linkVideo}" target="_blank" rel="noopener">Watch</a>
                            <span th:unless="${item.linkVideo != null}">—</span>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Remark 1</span>
                        <span class="detail-value" th:text="${item.remark1 != null ? item.remark1 : '—'}">—</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

        <!-- Edit Item Modal -->
        <div class="modal-overlay" x-show="showEdit" x-cloak @click.self="showEdit = false">
            <div class="modal-content" style="max-width:540px">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Item</h5>
                    <button class="btn-close" @click="showEdit = false"></button>
                </div>
                <form th:attr="hx-patch=@{/items/{id}(id=${item.itemId})}"
                      hx-on::after-request="if(event.detail.successful) showEdit = false">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Name EN</label>
                                <input type="text" name="itemNameEn" class="form-control"
                                       th:value="${item.itemNameEn}" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Name TH</label>
                                <input type="text" name="itemNameTh" class="form-control"
                                       th:value="${item.itemNameTh}">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Status</label>
                                <select name="itemStatus" class="form-select">
                                    <option value="ENABLE"  th:selected="${item.itemStatus == 'ENABLE'}">ENABLE</option>
                                    <option value="DISABLE" th:selected="${item.itemStatus == 'DISABLE'}">DISABLE</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Game Code</label>
                                <input type="text" name="gameCode" class="form-control"
                                       th:value="${item.gameCode}">
                            </div>
                            <div class="col-6 col-sm-3">
                                <label class="form-label">Players Min</label>
                                <input type="number" name="playerCountMin" class="form-control"
                                       th:value="${item.playerCountMin}" min="1">
                            </div>
                            <div class="col-6 col-sm-3">
                                <label class="form-label">Players Max</label>
                                <input type="number" name="playerCountMax" class="form-control"
                                       th:value="${item.playerCountMax}" min="1">
                            </div>
                            <div class="col-6 col-sm-3">
                                <label class="form-label">Time Min (min)</label>
                                <input type="number" name="playTimeMin" class="form-control"
                                       th:value="${item.playTimeMin}" min="1">
                            </div>
                            <div class="col-6 col-sm-3">
                                <label class="form-label">Time Max (min)</label>
                                <input type="number" name="playTimeMax" class="form-control"
                                       th:value="${item.playTimeMax}" min="1">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Difficulty (1–5)</label>
                                <input type="number" name="difficultyRating" class="form-control"
                                       th:value="${item.difficultyRating}" min="1" max="5" step="0.1">
                            </div>
                            <div class="col-12">
                                <label class="form-label">BoardGameGeek URL</label>
                                <input type="text" name="linkBoardgamegeek" class="form-control"
                                       th:value="${item.linkBoardgamegeek}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Video URL</label>
                                <input type="text" name="linkVideo" class="form-control"
                                       th:value="${item.linkVideo}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Remark</label>
                                <input type="text" name="remark1" class="form-control"
                                       th:value="${item.remark1}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Default PIN <span class="text-muted fw-normal">(ถ้าว่าง = random ทุกครั้ง)</span></label>
                                <input type="text" name="defaultPin" class="form-control font-monospace"
                                       th:value="${item.defaultPin}" maxlength="6" placeholder="e.g. 123456">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ghost" @click="showEdit = false">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
