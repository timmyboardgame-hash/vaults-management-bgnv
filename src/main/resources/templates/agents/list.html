<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Agents')}"></head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar('agents')}"></div>

    <main class="main-content" x-data="{ showCreate: false, showDelete: false, deleteId: '' }">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Agents</h1>
                <p class="page-subtitle">Manage all registered agents</p>
            </div>
            <button class="btn btn-primary btn-sm" @click="showCreate = true">
                <i class="bi bi-plus-lg me-1"></i>Add Agent
            </button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-search">
                <i class="bi bi-search toolbar-search-icon"></i>
                <input type="text"
                       class="form-control"
                       placeholder="Search agents..."
                       name="search"
                       hx-get="/agents"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#agents-tbody"
                       hx-swap="outerHTML"
                       hx-include="[name='binding']">
            </div>
            <select class="form-select"
                    name="binding"
                    hx-get="/agents"
                    hx-trigger="change"
                    hx-target="#agents-tbody"
                    hx-swap="outerHTML"
                    hx-include="[name='search']"
                    th:value="${currentBinding}">
                <option value=""           th:selected="${currentBinding == ''}">All Bindings</option>
                <option value="HAS_VAULTS" th:selected="${currentBinding == 'HAS_VAULTS'}">Has vaults</option>
                <option value="NO_VAULTS"  th:selected="${currentBinding == 'NO_VAULTS'}">No vaults</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-card">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Agent ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Phone</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="agents-tbody" th:fragment="agents-tbody">
                    <tr th:if="${agents.isEmpty()}" class="empty-row">
                        <td colspan="6" class="text-center">No agents found</td>
                    </tr>
                    <tr th:each="agent : ${agents}"
                        class="row-link"
                        th:attr="data-href='/agents/' + ${agent.agentId}"
                        onclick="window.location.href=this.dataset.href">
                        <td th:text="${agent.agentId}">—</td>
                        <td th:text="${agent.agentName != null ? agent.agentName : '—'}">—</td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:text="${agent.agentStatus}"
                                  th:classappend="'badge-' + ${agent.agentStatus}">—</span>
                        </td>
                        <td th:text="${agent.phone != null ? agent.phone : '—'}">—</td>
                        <td th:text="${agent.createdAt != null ? #temporals.format(agent.createdAt, 'dd/MM/yyyy') : '—'}">—</td>
                        <td @click.stop>
                            <button class="btn btn-sm btn-outline-danger"
                                    @click="deleteId = [[${agent.agentId}]]; showDelete = true">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="row-count" th:text="${agents.size()} + ' agent(s)'"></div>

        <!-- Create Modal -->
        <div class="modal-overlay" x-show="showCreate" x-cloak @click.self="showCreate = false">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Agent</h5>
                    <button type="button" class="btn-close" @click="showCreate = false"></button>
                </div>
                <form hx-post="/agents"
                      hx-on::after-request="if(event.detail.successful){ showCreate = false; window.location.reload(); }">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Agent ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="agentId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Agent Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="agentName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="agentStatus">
                                <option value="ENABLE">ENABLE</option>
                                <option value="DISABLE">DISABLE</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Map URL</label>
                            <input type="text" class="form-control" name="mapUrl">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Promotion</label>
                            <input type="text" class="form-control" name="promotion">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Remark</label>
                            <input type="text" class="form-control" name="remark1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" @click="showCreate = false">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirm Modal -->
        <div class="modal-overlay" x-show="showDelete" x-cloak @click.self="showDelete = false">
            <div class="modal-content" style="max-width:380px">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" @click="showDelete = false"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Delete agent <strong x-text="deleteId"></strong>? This cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" @click="showDelete = false">Cancel</button>
                    <button class="btn btn-danger btn-sm"
                            @click="htmx.ajax('DELETE', '/agents/' + deleteId, {}); showDelete = false">
                        Delete
                    </button>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
