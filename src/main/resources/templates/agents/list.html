<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Agents')}"></head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar('agents')}"></div>

    <main class="main-content" x-data="{ showCreate: false, showDelete: false, deleteId: '', showEdit: false, ed: {},
        saveEdit() {
            this.showEdit = false;
            const p = new URLSearchParams({
                newAgentId: this.ed.agentId || '', agentName: this.ed.name || '', agentStatus: this.ed.status || '',
                phone: this.ed.phone || '', address: this.ed.address || '', mapUrl: this.ed.mapUrl || '',
                promotion: this.ed.promotion || '', remark1: this.ed.remark1 || ''
            });
            fetch('/agents/' + this.ed.origId, {method:'PATCH', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:p})
                .then(r => r.ok ? window.location = '/agents' : r.text().then(t => alert(t)));
        }
    }">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Agents</h1>
                <p class="page-subtitle">Manage all registered agents</p>
            </div>
            <button class="btn btn-primary btn-sm" @click="showCreate = true">
                <i class="bi bi-plus-lg me-1"></i>Add Agent
            </button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-search">
                <i class="bi bi-search toolbar-search-icon"></i>
                <input type="text"
                       class="form-control"
                       placeholder="Search agents..."
                       name="search"
                       hx-get="/agents"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#agents-tbody"
                       hx-swap="outerHTML"
                       hx-include="[name='binding']">
            </div>
            <select class="form-select"
                    name="binding"
                    hx-get="/agents"
                    hx-trigger="change"
                    hx-target="#agents-tbody"
                    hx-swap="outerHTML"
                    hx-include="[name='search']"
                    th:value="${currentBinding}">
                <option value=""           th:selected="${currentBinding == ''}">All Bindings</option>
                <option value="HAS_VAULTS" th:selected="${currentBinding == 'HAS_VAULTS'}">Has vaults</option>
                <option value="NO_VAULTS"  th:selected="${currentBinding == 'NO_VAULTS'}">No vaults</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-card">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Agent ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Phone</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="agents-tbody" th:fragment="agents-tbody">
                    <tr th:if="${agents.isEmpty()}" class="empty-row">
                        <td colspan="6" class="text-center">No agents found</td>
                    </tr>
                    <tr th:each="agent : ${agents}"
                        class="row-link"
                        th:attr="data-href='/agents/' + ${agent.agentId}"
                        onclick="window.location.href=this.dataset.href">
                        <td th:text="${agent.agentId}">—</td>
                        <td th:text="${agent.agentName != null ? agent.agentName : '—'}">—</td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:text="${agent.agentStatus}"
                                  th:classappend="'badge-' + ${agent.agentStatus}">—</span>
                        </td>
                        <td th:text="${agent.phone != null ? agent.phone : '—'}">—</td>
                        <td th:text="${agent.createdAt != null ? #temporals.format(agent.createdAt, 'dd/MM/yyyy') : '—'}">—</td>
                        <td @click.stop style="width:110px; white-space:nowrap">
                            <button class="btn btn-sm btn-ghost"
                                    th:attr="data-orig-id=${agent.agentId},data-agent-id=${agent.agentId},data-name=${agent.agentName != null ? agent.agentName : ''},data-status=${agent.agentStatus},data-phone=${agent.phone != null ? agent.phone : ''},data-address=${agent.address != null ? agent.address : ''},data-map-url=${agent.mapUrl != null ? agent.mapUrl : ''},data-promotion=${agent.promotion != null ? agent.promotion : ''},data-remark1=${agent.remark1 != null ? agent.remark1 : ''}"
                                    @click="ed = {...$el.dataset}; showEdit = true"
                                    title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger"
                                    th:attr="data-del-id=${agent.agentId}"
                                    @click="deleteId = $el.dataset.delId; showDelete = true">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="row-count" th:text="${agents.size()} + ' agent(s)'"></div>

        <!-- Edit Agent Modal -->
        <div class="modal-overlay" x-show="showEdit" x-cloak @click.self="showEdit = false">
            <div class="modal-content" style="max-width:520px">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Agent</h5>
                    <button class="btn-close" @click="showEdit = false"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Agent ID</label>
                            <input type="text" class="form-control font-monospace" x-model="ed.agentId" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" x-model="ed.name" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" x-model="ed.status">
                                <option value="ENABLE">ENABLE</option>
                                <option value="DISABLE">DISABLE</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" x-model="ed.phone">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="2" x-model="ed.address"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Map URL</label>
                            <input type="text" class="form-control" x-model="ed.mapUrl">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Promotion</label>
                            <input type="text" class="form-control" x-model="ed.promotion">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Remark 1</label>
                            <input type="text" class="form-control" x-model="ed.remark1">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" @click="showEdit = false">Cancel</button>
                    <button class="btn btn-primary" @click="saveEdit()">Save</button>
                </div>
            </div>
        </div>

        <!-- Create Modal -->
        <div class="modal-overlay" x-show="showCreate" x-cloak @click.self="showCreate = false">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Agent</h5>
                    <button type="button" class="btn-close" @click="showCreate = false"></button>
                </div>
                <form hx-post="/agents"
                      hx-on::after-request="if(event.detail.successful){ showCreate = false; window.location.reload(); }">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Agent ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="agentId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Agent Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="agentName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="agentStatus">
                                <option value="ENABLE">ENABLE</option>
                                <option value="DISABLE">DISABLE</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Map URL</label>
                            <input type="text" class="form-control" name="mapUrl">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Promotion</label>
                            <input type="text" class="form-control" name="promotion">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Remark</label>
                            <input type="text" class="form-control" name="remark1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" @click="showCreate = false">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirm Modal -->
        <div class="modal-overlay" x-show="showDelete" x-cloak @click.self="showDelete = false">
            <div class="modal-content" style="max-width:380px">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" @click="showDelete = false"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Delete agent <strong x-text="deleteId"></strong>? This cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" @click="showDelete = false">Cancel</button>
                    <button class="btn btn-danger btn-sm"
                            @click="showDelete = false; fetch('/agents/' + deleteId, {method:'DELETE'}).then(() => window.location = '/agents')">
                        Delete
                    </button>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
